# fail2ban jail for Personal Learning OS
# Install: append (or include) into /etc/fail2ban/jail.local
#
# Setup steps on VPS:
#   sudo apt install fail2ban
#   sudo cp config/fail2ban/filter-learning-os.conf /etc/fail2ban/filter.d/learning-os.conf
#   sudo tee -a /etc/fail2ban/jail.local < config/fail2ban/jail-learning-os.conf
#   sudo systemctl restart fail2ban
#   sudo fail2ban-client status learning-os   # verify

[learning-os]
enabled   = true
port      = http,https
filter    = learning-os
logpath   = /var/log/nginx/access.log
# Ban after 10 rate-limited responses in 10 minutes
maxretry  = 10
findtime  = 600
# Ban for 1 hour
bantime   = 3600
action    = %(action_mwl)s

# Also protect SSH
[sshd]
enabled   = true
port      = ssh
filter    = sshd
logpath   = /var/log/auth.log
maxretry  = 5
findtime  = 300
bantime   = 86400
