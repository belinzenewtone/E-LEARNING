# fail2ban filter for Personal Learning OS
# Matches IPs that trigger Nginx 429 (rate-limited) on login endpoints
# Install: cp filter-learning-os.conf /etc/fail2ban/filter.d/learning-os.conf

[INCLUDES]
before = common.conf

[Definition]
# Nginx logs 429 when limit_req_zone is hit
# Format: IP - - [date] "METHOD /api/auth/login ..." 429 ...
failregex = ^<HOST> -.*"(POST|GET) /api/auth/(login|signin|callback).*" 429

ignoreregex =
